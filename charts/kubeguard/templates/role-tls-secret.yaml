apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeguard.fullname" . }}-tls-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeguard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.tls.secretName | quote }}]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeguard.fullname" . }}-tls-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeguard.fullname" . }}-tls-secret
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeguard.fullname" . }}
    namespace: {{ .Release.Namespace }}
