apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-deployment
spec:
  selector:
    matchLabels:
      app: insecure-app
  template:
    metadata:
      labels:
        app: insecure-app
    spec:
      hostNetwork: true
      containers:
      - name: app
        image: myapp:latest
        securityContext:
          privileged: true
