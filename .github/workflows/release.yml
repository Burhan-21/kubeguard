name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      dry_run:
        description: 'Dry run (build and test artifacts without publishing release)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build & Package Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Determine Release Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Cross-Compile Binaries
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE} -X github.com/Burhan-21/kubeguard/internal/version.Version=${VERSION} -X github.com/Burhan-21/kubeguard/internal/version.GitCommit=${COMMIT} -X github.com/Burhan-21/kubeguard/internal/version.BuildDate=${BUILD_DATE}"

          echo "=== Compiling linux/amd64 ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubeguard ./cmd/kubeguard
          tar -czvf "dist/kubeguard_${VERSION}_linux_amd64.tar.gz" -C dist kubeguard
          rm -f dist/kubeguard

          echo "=== Compiling linux/arm64 ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/kubeguard ./cmd/kubeguard
          tar -czvf "dist/kubeguard_${VERSION}_linux_arm64.tar.gz" -C dist kubeguard
          rm -f dist/kubeguard

          echo "=== Compiling darwin/amd64 ==="
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubeguard ./cmd/kubeguard
          tar -czvf "dist/kubeguard_${VERSION}_darwin_amd64.tar.gz" -C dist kubeguard
          rm -f dist/kubeguard

          echo "=== Compiling darwin/arm64 ==="
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/kubeguard ./cmd/kubeguard
          tar -czvf "dist/kubeguard_${VERSION}_darwin_arm64.tar.gz" -C dist kubeguard
          rm -f dist/kubeguard

          echo "=== Compiling windows/amd64 ==="
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubeguard.exe ./cmd/kubeguard
          (cd dist && zip -q "kubeguard_${VERSION}_windows_amd64.zip" kubeguard.exe && rm -f kubeguard.exe)

      - name: Generate and Verify SHA-256 Checksums
        run: |
          cd dist
          sha256sum kubeguard_*.tar.gz kubeguard_*.zip > checksums.txt
          echo "=== SHA-256 Checksums ==="
          cat checksums.txt
          echo "=== Verifying Checksums ==="
          sha256sum -c checksums.txt

      - name: Attest Build Provenance
        if: ${{ github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/kubeguard_*'

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat << 'EOF' > dist/RELEASE_NOTES.md
          ## KubeGuard v0.1.0 Release

          KubeGuard is an open-source Kubernetes deployment security and operational reliability policy engine.

          ### Download & Verify

          #### 1. Download for your platform:
          - Linux (x86_64): `kubeguard_v0.1.0_linux_amd64.tar.gz`
          - Linux (ARM64): `kubeguard_v0.1.0_linux_arm64.tar.gz`
          - macOS (Intel): `kubeguard_v0.1.0_darwin_amd64.tar.gz`
          - macOS (Apple Silicon): `kubeguard_v0.1.0_darwin_arm64.tar.gz`
          - Windows (x86_64): `kubeguard_v0.1.0_windows_amd64.zip`

          #### 2. Verify SHA-256 Checksums:
          ```bash
          curl -sSLO https://github.com/Burhan-21/kubeguard/releases/download/v0.1.0/checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          ```

          #### 3. Container Image:
          ```bash
          docker pull ghcr.io/burhan-21/kubeguard:v0.1.0
          ```
          EOF

          gh release create "$TAG" \
            --title "KubeGuard $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/kubeguard_* dist/checksums.txt

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 14

  publish-container:
    name: Build & Publish Container Image (GHCR)
    runs-on: ubuntu-latest
    needs: build-binaries
    if: ${{ github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/burhan-21/kubeguard:${{ steps.meta.outputs.tag }}
            ghcr.io/burhan-21/kubeguard:latest

      - name: Scan Published Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/burhan-21/kubeguard:${{ steps.meta.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
