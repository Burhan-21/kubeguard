name: Admission Load Test

on:
  workflow_dispatch:
    inputs:
      requests:
        description: 'Total AdmissionReview requests for sustained load'
        required: true
        default: '1000'
      concurrency:
        description: 'Concurrent client workers'
        required: true
        default: '20'

jobs:
  load-test:
    name: High-Throughput Admission Load Suite (KinD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Binary
        run: go build -v -o bin/kubeguard ./cmd/kubeguard

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: kubeguard:local

      - name: Create KinD Cluster
        run: |
          kind create cluster --name kubeguard-load --image "kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30" --wait 120s
          kind load docker-image kubeguard:local --name kubeguard-load

      - name: Generate TLS Certificates & Deploy Helm (Multi-Replica HA: 2 Replicas)
        run: |
          mkdir -p /tmp/k8s-webhook-certs
          cd /tmp/k8s-webhook-certs

          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -nodes -key ca.key -subj "/CN=kubeguard-ca" -days 365 -out ca.crt

          openssl genrsa -out tls.key 2048
          cat <<EOF > csr.conf
          [req]
          req_extensions = v3_req
          distinguished_name = req_distinguished_name
          [req_distinguished_name]
          [v3_req]
          basicConstraints = CA:FALSE
          keyUsage = nonRepudiation, digitalSignature, keyEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = kubeguard
          DNS.2 = kubeguard.kubeguard-system
          DNS.3 = kubeguard.kubeguard-system.svc
          DNS.4 = kubeguard.kubeguard-system.svc.cluster.local
          EOF

          openssl req -new -key tls.key -out tls.csr -subj "/CN=kubeguard.kubeguard-system.svc" -config csr.conf
          openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out tls.crt -days 365 -extensions v3_req -extfile csr.conf

          CA_BUNDLE=$(base64 -w 0 < ca.crt)

          kubectl create namespace kubeguard-system
          kubectl create secret tls kubeguard-tls --cert=tls.crt --key=tls.key -n kubeguard-system

          helm install kubeguard charts/kubeguard \
            --namespace kubeguard-system \
            --set image.repository=kubeguard \
            --set image.tag=local \
            --set image.pullPolicy=Never \
            --set webhook.caBundle="${CA_BUNDLE}" \
            --set replicaCount=2 \
            --wait --timeout=90s

          kubectl wait --namespace kubeguard-system --for=condition=ready pod -l app.kubernetes.io/name=kubeguard --timeout=90s

      - name: Multi-Replica (2 Replicas) Load Test Suite
        run: |
          kubectl port-forward -n kubeguard-system svc/kubeguard 18443:443 &
          PF_PID=$!
          sleep 4

          echo "=== 1. Warm-up Phase (100 Requests, Concurrency 5) ==="
          ./bin/kubeguard load-test --target-url https://127.0.0.1:18443/validate --workload compliant --requests 100 --concurrency 5

          echo "=== 2. Sustained Load Phase (${{ github.event.inputs.requests || 1000 }} Requests, Concurrency ${{ github.event.inputs.concurrency || 20 }}) ==="
          ./bin/kubeguard load-test --target-url https://127.0.0.1:18443/validate --workload mixed --requests ${{ github.event.inputs.requests || 1000 }} --concurrency ${{ github.event.inputs.concurrency || 20 }}

          echo "=== 3. Burst Load Phase (500 Requests, Concurrency 30) ==="
          ./bin/kubeguard load-test --target-url https://127.0.0.1:18443/validate --workload mixed --requests 500 --concurrency 30

          echo "=== 4. Recovery Phase (50 Requests, Concurrency 2) ==="
          ./bin/kubeguard load-test --target-url https://127.0.0.1:18443/validate --workload compliant --requests 50 --concurrency 2

          echo "=== 5. Multi-Replica Prometheus Histogram Scrape ==="
          curl -k -s https://127.0.0.1:18443/metrics | grep "kubeguard_admission_request_duration_seconds"

          kill $PF_PID || true

      - name: Single-Replica (1 Replica) Scaling Comparison
        run: |
          echo "Scaling down to 1 replica for comparison baseline..."
          kubectl scale deployment kubeguard -n kubeguard-system --replicas=1
          kubectl rollout status deployment/kubeguard -n kubeguard-system --timeout=60s

          kubectl port-forward -n kubeguard-system svc/kubeguard 18443:443 &
          PF2_PID=$!
          sleep 4

          echo "=== Single-Replica Sustained Load (500 Requests, Concurrency 10) ==="
          ./bin/kubeguard load-test --target-url https://127.0.0.1:18443/validate --workload mixed --requests 500 --concurrency 10

          kill $PF2_PID || true

      - name: Teardown KinD Cluster
        if: always()
        run: kind delete cluster --name kubeguard-load || true
